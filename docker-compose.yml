services:
  chatbot:
    build: .
    env_file: .env
    restart: unless-stopped
    depends_on:
      followup-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - followup_data:/app/storage/followups
  # Ensures both newly created and previously existing Docker volumes are
  # writable by the non-root API user. It does not delete existing lead data.
  followup-init:
    build: .
    user: root
    restart: "no"
    command: ["sh", "-c", "mkdir -p /app/storage/followups && chown -R appuser:appuser /app/storage/followups"]
    volumes:
      - followup_data:/app/storage/followups
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - chatbot
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/chatbot.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  followup_data:
